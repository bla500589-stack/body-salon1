<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بودي - نظام صالونات الحلاقة</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>body { margin: 0; padding: 0; }</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const services = [
          { id: 1, name: "شعر ودقن", price: 130 },
          { id: 2, name: "شعر بس", price: 100 },
          { id: 3, name: "شعر ودقن واستشوار", price: 200 },
          { id: 4, name: "شعر ودقن واستشوار + ماسك", price: 300 },
          { id: 5, name: "عرض العريس", price: 1000 },
          { id: 6, name: "عرض الروشنة", price: 500 },
        ];
        const branches = ["عين شمس", "المرج", "الدقي"];
        const barbers = ["محمود", "نور", "عمر السيد", "عمر علاء", "مصطفى مشعل"];
        const times = ["10:00 ص", "11:00 ص", "12:00 م", "1:00 م", "2:00 م", "3:00 م", "4:00 م", "5:00 م", "6:00 م"];
        
        const css = `
        *{box-sizing:border-box}
        body{margin:0;font-family:Tahoma,Arial;background:#f3f5f9;color:#172338}
        button,input,select{font:inherit}
        button{cursor:pointer}
        .app{direction:rtl;min-height:100vh;display:flex;flex-direction:column}
        header{background:#142238;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
        header h2{margin:0;color:#e8bb76;font-size:35px;font-weight:bold;}
        header small{color:#bbc5d5}
        nav{display:flex;gap:8px;flex-wrap:wrap;padding:15px 6%;background:white;border-bottom:1px solid #ddd; justify-content:center;}
        nav button{border:0;border-radius:8px;padding:10px 14px;background:#edf0f5;color:#172338}
        nav button.active{background:#142238;color:white}
        main{max-width:1100px;margin:auto;padding:25px 16px; flex:1; width:100%;}
        .hero{background:linear-gradient(120deg,#142238,#344b68);color:white;padding:30px;border-radius:16px;margin-bottom:22px;}
        .hero h1{font-size:32px;margin:10px 0}
        .gold{color:#e8bb76}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
        .card,.panel{background:white;border:1px solid #e2e6ed;border-radius:12px;padding:17px;margin-bottom:13px}
        .card h3{margin:5px 0 10px}
        .price{font-size:22px;font-weight:bold;color:#a77835}
        button.primary{border:0;background:#e8bb76;color:#142238;font-weight:bold;border-radius:8px;padding:12px 16px}
        button.secondary{border:0;background:#142238;color:white;border-radius:8px;padding:10px 14px}
        button.danger{border:0;background:#fee9e9;color:#9b2525;border-radius:7px;padding:8px}
        input,select{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:8px;background:white;margin:7px 0 13px}
        label{font-size:13px;font-weight:bold}
        h2.section{font-size:22px;margin-top:28px}
        .muted{font-size:12px;color:#788397;line-height:1.8}
        .success{background:#e6f8ed;color:#17663a;padding:13px;border-radius:9px;margin-bottom:15px}
        .warning-box { background: #fff3cd; color: #856404; padding: 13px; border-radius: 9px; border: 1px solid #ffeeba; margin-bottom: 15px; font-weight: bold;}
        .row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
        .stat{background:#fff;border:1px solid #e2e6ed;padding:17px;border-radius:12px}
        .stat strong{display:block;font-size:25px;margin-top:8px;color:#a77835}
        footer{text-align:center;padding:25px;color:#8993a2;font-size:12px; background: #142238; color: white; margin-top: 20px;}
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .social-icons a { color: white; text-decoration: none; font-size: 20px; }
        .game-board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; margin-top: 20px;}
        .square { width: 100px; height: 100px; background: #fff; border: 2px solid #142238; font-size: 50px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #142238;}
        .square:hover { background: #f0f0f0; }
        
        .splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #142238; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; transition: opacity 1s; }
        .splash h1 { font-size: 70px; color: #e8bb76; margin-bottom: 20px; text-shadow: 0 0 10px rgba(232, 187, 118, 0.5);}
        .splash p { font-size: 24px; font-weight: bold; }
        
        .memory-grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; justify-content: center; margin-top: 20px;}
        .memory-card { width: 70px; height: 70px; background: #142238; color: white; font-size: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; }
        .memory-card.flipped { background: #e8bb76; color: #142238; }
        
        .tasbih-btn { width: 150px; height: 150px; border-radius: 50%; background: #e8bb76; color: #142238; font-size: 40px; font-weight: bold; border: 5px solid #142238; margin: 20px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); user-select: none;}
        .tasbih-btn:active { transform: scale(0.95); }
        
        .azkar-text { line-height: 2; font-size: 18px; text-align: justify; background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px;}
        .azkar-text p { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ddd;}
        .azkar-text p:last-child { border-bottom: none; }
        `;

        function SplashScreen({ onFinish }) {
          useEffect(() => {
            const timer = setTimeout(onFinish, 3000); 
            return () => clearTimeout(timer);
          }, [onFinish]);
          return (
            <div className="splash">
              <h1>بودي ✂️</h1>
              <p>أهلاً بعملاء بودي.. نتشرف بحضوركم!</p>
            </div>
          );
        }

        function App() {
          const [showSplash, setShowSplash] = useState(true);
          const [page, setPage] = useState("home"); 
          
          const [bookings, setBookings] = useState(() => { try { return JSON.parse(localStorage.getItem("body_bookings") || "[]"); } catch { return []; } });
          const [branch, setBranch] = useState(branches[0]);
          const [barber, setBarber] = useState(barbers[0]);
          const [bookingType, setBookingType] = useState("advance"); 
          const [date, setDate] = useState(new Date().toLocaleDateString("en-CA"));
          const [time, setTime] = useState(times[0]);
          const [name, setName] = useState("");
          const [phone, setPhone] = useState("");
          const [message, setMessage] = useState("");
          
          const [board, setBoard] = useState(Array(9).fill(null));
          const [isXNext, setIsXNext] = useState(true);
          const winner = calculateWinner(board);
          
          const [memoryCards, setMemoryCards] = useState([]);
          const [flipped, setFlipped] = useState([]);
          const [solved, setSolved] = useState([]);

          const [tasbihCount, setTasbihCount] = useState(0);
          const [currentZekr, setCurrentZekr] = useState("سبحان الله");
          const [showCelebration, setShowCelebration] = useState(false);
          const [adminPassword, setAdminPassword] = useState("");
          const [isAdminAuth, setIsAdminAuth] = useState(false);

          useEffect(() => {
            const emojis = ["✂️", "🪒", "💈", "🧴", "🪞", "🧼", "🪥", "💅"];
            const deck = [...emojis, ...emojis].sort(() => Math.random() - 0.5).map((emoji, index) => ({ id: index, emoji }));
            setMemoryCards(deck);
          }, []);

          useEffect(() => { localStorage.setItem("body_bookings", JSON.stringify(bookings)); }, [bookings]);

          const zekrList = ["سبحان الله", "الحمد لله", "الله أكبر", "لا إله إلا الله", "صلى الله عليه وسلم", "أستغفر الله"];

          const increaseTasbih = () => {
            const newCount = tasbihCount + 1;
            setTasbihCount(newCount);
            if (newCount % 10 === 0) {
              setShowCelebration(true);
              setTimeout(() => setShowCelebration(false), 3000);
            }
          };

          function handleBooking(e, service) {
            e.preventDefault();
            if (!name.trim() || !phone.trim()) { setMessage("من فضلك اكتب اسم العميل ورقم الموبايل."); return; }
            let newBooking = {};
            const deposit = service.price / 2; 
            if (bookingType === "advance") {
              newBooking = { id: Date.now(), name, phone, branch, barber, service: service.name, price: service.price, type: "حجز مسبق", date, time, deposit: deposit, status: "مؤكد (عربون غير مسترد)" };
              setMessage("تم تسجيل الحجز المسبق! برجاء الحضور في الميعاد.");
            } else {
              const currentQueue = bookings.filter(b => b.type === "دور الآن").length;
              const myTurn = 100 + currentQueue;
              newBooking = { id: Date.now(), name, phone, branch, barber, service: service.name, price: service.price, type: "دور الآن", turnNumber: myTurn, deposit: 0, status: "في الانتظار" };
              setMessage(`تم تسجيلك في الانتظار! رقم دورك هو: ${myTurn}`);
            }
            setBookings(old => [newBooking, ...old]); setName(""); setPhone(""); setPage("bookings");
          }

          function handleMemoryClick(index) {
            if (flipped.length === 2 || flipped.includes(index) || solved.includes(index)) return;
            const newFlipped = [...flipped, index];
            setFlipped(newFlipped);
            if (newFlipped.length === 2) {
              if (memoryCards[newFlipped[0]].emoji === memoryCards[newFlipped[1]].emoji) {
                setSolved([...solved, ...newFlipped]);
                setFlipped([]);
              } else {
                setTimeout(() => setFlipped([]), 1000);
              }
            }
          }

          const handleAdminLogin = (e) => {
            e.preventDefault();
            if (adminPassword === "1") {
              setIsAdminAuth(true);
              setMessage("");
            } else {
              setMessage("كلمة المرور غير صحيحة!");
              setAdminPassword("");
            }
          };

          const nav = [["home", "الرئيسية"], ["booking", "حجز جديد"], ["bookings", "الحجوزات"], ["games", "تسلية 🎮"], ["islamic", "قرآن وأذكار 🕌"], ["admin", "الإدارة"]];

          if (showSplash) {
            return <SplashScreen onFinish={() => setShowSplash(false)} />;
          }

          return (
            <div className="app">
              <style>{css}</style>
              <header>
                <div><h2>بودي</h2><small>نظام صالونات الحلاقة الذكي</small></div>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <span>💈 احجز حلاقتك بسهولة</span>
                </div>
              </header>
              
              <nav>
                {nav.map(([id, title]) => (
                  <button 
                    key={id} 
                    className={page === id || (page.startsWith("azkar") && id === "islamic") ? "active" : ""} 
                    onClick={() => { setPage(id); setMessage(""); }}
                  >
                    {title}
                  </button>
                ))}
              </nav>

              <main>
                {message && (<div className="success">{message}<button onClick={() => setMessage("")} style={{ float: "left", border: 0, background: "transparent" }}>✕</button></div>)}
                
                {page === "home" && (
                  <>
                    <section className="hero">
                      <small className="gold">تجربة حلاقة مختلفة</small>
                      <h1>حلاقتك الجاية، <span className="gold">على مزاجك.</span></h1>
                      <p>اختار الفرع والحلاق والخدمة المناسبة ليك. احجز موعدك واجمع زياراتك للحصول على مكافآت.</p>
                      <button className="primary" onClick={() => setPage("booking")}>احجز موعدك الآن ←</button>
                    </section>
                    <h2 className="section">الخدمات والأسعار</h2>
                    <div className="grid">{services.map(s => (<div className="card" key={s.id}><h3>✂ {s.name}</h3><p className="price">{s.price} جنيه</p><button className="secondary" onClick={() => setPage("booking")}>اختار الخدمة</button></div>))}</div>
                  </>
                )}

                {page === "booking" && (
                  <>
                    <h2 className="section">حجز موعد جديد</h2>
                    <div className="panel">
                      <label>اختر الخدمة:</label>
                      <select id="serviceSelector" style={{ marginBottom: 20 }}>{services.map(s => <option key={s.id} value={s.id}>{s.name} — {s.price} جنيه</option>)}</select>
                      <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
                        <button type="button" className={bookingType === "advance" ? "primary" : "secondary"} onClick={() => setBookingType("advance")} style={{ flex: 1 }}>حجز مسبق (ميعاد محدد)</button>
                        <button type="button" className={bookingType === "now" ? "primary" : "secondary"} onClick={() => setBookingType("now")} style={{ flex: 1 }}>حجز فوري (دور الآن)</button>
                      </div>
                      <form onSubmit={(e) => { const selectedId = document.getElementById("serviceSelector").value; const service = services.find(s => s.id === parseInt(selectedId)); handleBooking(e, service); }}>
                        <label>الفرع</label><select value={branch} onChange={e => setBranch(e.target.value)}>{branches.map(b => <option key={b}>{b}</option>)}</select>
                        <label>الحلاق المفضل</label><select value={barber} onChange={e => setBarber(e.target.value)}>{barbers.map(b => <option key={b}>{b}</option>)}</select>
                        {bookingType === "advance" && (
                          <>
                            <div className="warning-box">⚠️ تنبيه هام: في الحجز المسبق، يتم دفع عربون (50% من قيمة الخدمة). هذا العربون غير مسترد في حالة عدم الحضور في الميعاد المحدد.</div>
                            <label>تاريخ الحجز</label><input type="date" min={new Date().toLocaleDateString("en-CA")} value={date} onChange={e => setDate(e.target.value)} required />
                            <label>الميعاد</label><select value={time} onChange={e => setTime(e.target.value)}>{times.map(t => <option key={t}>{t}</option>)}</select>
                          </>
                        )}
                        <label>اسم العميل</label><input value={name} onChange={e => setName(e.target.value)} placeholder="اكتب الاسم" required />
                        <label>رقم الموبايل</label><input type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="01xxxxxxxxx" required />
                        <button className="primary" type="submit" style={{ marginTop: 20, width: "100%" }}>{bookingType === "advance" ? "تأكيد الحجز ودفع العربون" : "خذ رقم دورك الآن"}</button>
                      </form>
                    </div>
                  </>
                )}

                {page === "bookings" && (
                  <>
                    <div className="hero" style={{ padding: 20, marginBottom: 20, textAlign: "center" }}>
                      <h2 style={{ margin: 0, color: "white" }}>برنامج الولاء 🎁</h2>
                      <p style={{ fontSize: 20, fontWeight: "bold", margin: "10px 0 0 0" }}>{bookings.length >= 5 ? "مبروك! زيارتك السادسة مجانية بالكامل ✂️🎉" : `فاضلك ${5 - bookings.length} زيارات وتاخد السادسة مجاناً! 🎁`}</p>
                      <small style={{ color: "#ccc" }}>عدد زياراتك: {bookings.length}</small>
                    </div>
                    <h2 className="section">الحجوزات المسجلة</h2>
                    {bookings.length === 0 ? (<div className="panel">لا توجد حجوزات حتى الآن.</div>) : (bookings.map(b => (<div className="panel" key={b.id} style={{ borderRight: b.type === 'دور الآن' ? '5px solid #e8bb76' : '5px solid #142238' }}><div className="row"><h3>{b.name} — {b.service}</h3><span className="gold" style={{ fontWeight: "bold" }}>{b.type}</span></div><p>الفرع: {b.branch} | الحلاق: {b.barber}</p>{b.type === "حجز مسبق" ? (<p>الموعد: {b.date} — {b.time} (العربون: {b.deposit} جنيه)</p>) : (<p style={{ fontSize: 20, color: '#d35400' }}>رقم الدور: <b>{b.turnNumber}</b></p>)}<small className="muted">{b.status}</small></div>)))}
                  </>
                )}

                {page === "games" && (
                  <>
                    <h2 className="section">تسلية 🎮</h2>
                    <div style={{ display: "flex", gap: 20, flexWrap: "wrap", justifyContent: "center" }}>
                        <div className="panel" style={{ flex: 1, minWidth: 300, textAlign: "center" }}>
                          <h3>لعبة إكس أو (XO)</h3>
                          <h4>{winner ? `الفائز: ${winner}` : `دور اللاعب: ${isXNext ? 'X' : 'O'}`}</h4>
                          <div className="game-board">{board.map((square, i) => (<button key={i} className="square" onClick={() => { if (winner || board[i]) return; const newBoard = [...board]; newBoard[i] = isXNext ? 'X' : 'O'; setBoard(newBoard); setIsXNext(!isXNext); }}>{square}</button>))}</div>
                          <button className="secondary" style={{ marginTop: 20 }} onClick={() => { setBoard(Array(9).fill(null)); setIsXNext(true); }}>إعادة اللعب</button>
                        </div>

                        <div className="panel" style={{ flex: 1, minWidth: 300, textAlign: "center" }}>
                          <h3>لعبة الذاكرة (توصيل الكروت)</h3>
                          <div className="memory-grid">
                            {memoryCards.map((card, i) => {
                               const isFlipped = flipped.includes(i) || solved.includes(i);
                               return (
                                 <div key={i} className={`memory-card ${isFlipped ? 'flipped' : ''}`} onClick={() => handleMemoryClick(i)}>
                                   {isFlipped ? card.emoji : '?'}
                                 </div>
                               );
                            })}
                          </div>
                          <button className="secondary" style={{ marginTop: 20 }} onClick={() => { window.location.reload(); }}>إعادة اللعب</button>
                        </div>
                    </div>
                  </>
                )}

                {page === "islamic" && (
                   <>
                     <h2 className="section">القرآن والأذكار 🕌</h2>
                     <div className="grid">
                        <div className="card" style={{display: 'flex', flexDirection: 'column', gap: 10}}>
                           <button className="primary" style={{padding: 20, fontSize: 18}} onClick={() => setPage("azkar_morning")}>☀️ أذكار الصباح</button>
                           <button className="secondary" style={{padding: 20, fontSize: 18}} onClick={() => setPage("azkar_evening")}>🌙 أذكار المساء</button>
                        </div>

                        <div className="card" style={{textAlign: "center"}}>
                           <h3>ركن التسبيح 📿</h3>
                           <div style={{marginBott
